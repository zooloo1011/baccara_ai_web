<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Baccarat AI Ultimate</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

*{
box-sizing:border-box;
}

body{

margin:0;

background:#020617;

color:white;

font-family:
Microsoft YaHei,Arial;

}



header{

padding:22px;

background:#111827;

font-size:30px;

font-weight:bold;

color:#00eaff;

}



.online{

float:right;

font-size:15px;

color:#22c55e;

}



.container{

max-width:1300px;

margin:auto;

padding:20px;

}



.box{

background:#111827;

border-radius:15px;

padding:20px;

margin-bottom:20px;

box-shadow:
0 0 20px #000;

}




.ai{

text-align:center;

border:
1px solid #00eaff;

}



#prediction{

font-size:60px;

font-weight:bold;

margin:20px;

}



#confidence{

font-size:22px;

color:#94a3b8;

}





input{

width:80%;

padding:15px;

background:#020617;

border:1px solid #334155;

color:white;

font-size:18px;

border-radius:10px;

}




button{

padding:14px 20px;

border:0;

border-radius:10px;

margin:5px;

cursor:pointer;

font-weight:bold;

font-size:16px;

}



.bank{

background:#dc2626;

color:white;

}



.player{

background:#2563eb;

color:white;

}



.tie{

background:#16a34a;

color:white;

}



.action{

background:#00eaff;

color:#020617;

}



.clear{

background:#475569;

color:white;

}




.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:15px;

}



.card{

background:#0f172a;

padding:20px;

border-radius:12px;

}



.title{

color:#94a3b8;

}



.num{

font-size:35px;

color:#00eaff;

margin-top:10px;

}





.ball{

display:inline-flex;

width:40px;

height:40px;

border-radius:50%;

align-items:center;

justify-content:center;

margin:5px;

font-weight:bold;

}



.B{

background:#dc2626;

}



.P{

background:#2563eb;

}



.T{

background:#16a34a;

}



.road{

background:#020617;

padding:15px;

border-radius:10px;

min-height:70px;

}




.progress{

height:22px;

background:#334155;

border-radius:20px;

overflow:hidden;

margin:10px 0;

}



.bar{

height:100%;

background:#00eaff;

width:0%;

}



.report{

background:#020617;

padding:20px;

border-radius:10px;

line-height:1.8;

color:#00eaff;

}




</style>

</head>



<body>


<header>

🤖 Baccarat AI Ultimate

<span class="online">

● ONLINE

</span>

</header>




<div class="container">



<div class="box ai">


<h2>

NEXT ROUND AI SIGNAL

</h2>


<div id="prediction">

等待数据

</div>


<div id="confidence">

输入历史结果开始分析

</div>


</div>






<div class="box">


<h2>

输入历史百家乐结果

</h2>



<input id="input"

placeholder="例如 BPPBBTBBP">



<br>



<button class="action"

onclick="loadInput()">

分析

</button>



<button class="bank"

onclick="add('B')">

庄 BANKER

</button>



<button class="player"

onclick="add('P')">

闲 PLAYER

</button>



<button class="tie"

onclick="add('T')">

和 TIE

</button>



<button class="clear"

onclick="clearAll()">

清空

</button>



</div>








<div class="grid">


<div class="card">

<div class="title">

总局数

</div>

<div class="num"

id="total">

0

</div>

</div>



<div class="card">

<div class="title">

庄

</div>

<div class="num"

id="banker">

0

</div>

</div>




<div class="card">

<div class="title">

闲

</div>

<div class="num"

id="player">

0

</div>

</div>




<div class="card">

<div class="title">

和

</div>

<div class="num"

id="tie">

0

</div>

</div>



</div>







<div class="box">

<h2>

历史路单

</h2>


<div id="road"

class="road">

</div>


</div>






<div class="box">


<h2>

AI趋势评分

</h2>


庄趋势


<div class="progress">

<div id="bbar"

class="bar">

</div>

</div>




闲趋势


<div class="progress">

<div id="pbar"

class="bar">

</div>

</div>



</div>







<div class="box">


<h2>

AI分析报告

</h2>


<div id="report"

class="report">

等待分析

</div>


</div>






<div class="box">


<h2>

趋势图

</h2>


<canvas id="chart">

</canvas>


</div>




<script>
    
// ===============================
// Baccarat AI Core
// ===============================


let history=[];

let chart;



// 添加结果

function add(x){

history.push(x);

save();

update();

}



// 输入字符串

function loadInput(){

let text=
document
.getElementById("input")
.value
.toUpperCase();


history=[];


for(let x of text){


if(
x==="B"||
x==="P"||
x==="T"
)

history.push(x);


}



save();

update();


}



// 清除

function clearAll(){

history=[];

localStorage.removeItem(
"baccarat_ai"
);

update();

}




// 保存

function save(){

localStorage.setItem(
"baccarat_ai",
JSON.stringify(history)
);

}




// 读取

function load(){

let d=
localStorage.getItem(
"baccarat_ai"
);


if(d)

history=
JSON.parse(d);


}






// ===============================
// 更新数据
// ===============================


function update(){



let B=
history.filter(
x=>x==="B"
).length;


let P=
history.filter(
x=>x==="P"
).length;



let T=
history.filter(
x=>x==="T"
).length;



total.innerHTML=
history.length;


banker.innerHTML=
B;


player.innerHTML=
P;


tie.innerHTML=
T;



drawRoad();

analyze();


drawChart();


}







// ===============================
// 路单
// ===============================


function drawRoad(){


let box=
document.getElementById(
"road"
);


box.innerHTML="";



history.forEach(x=>{


let e=
document.createElement(
"span"
);


e.className=
"ball "+x;


e.innerHTML=x;


box.appendChild(e);



});


}








// ===============================
// AI分析
// ===============================


function analyze(){


if(history.length<5)

return;




let B=
history.filter(
x=>x==="B"
).length;


let P=
history.filter(
x=>x==="P"
).length;


let T=
history.filter(
x=>x==="T"
).length;



let scoreB=50;


let scoreP=50;




// 历史比例

if(B>P)

scoreB+=10;

else

scoreP+=10;





// 最近趋势


let recent=
history.slice(-20);



let rb=
recent.filter(
x=>x==="B"
).length;


let rp=
recent.filter(
x=>x==="P"
).length;



if(rb>rp)

scoreB+=15;

else

scoreP+=15;







// 连续检测


let last=
history[
history.length-1
];


let streak=1;



for(
let i=history.length-2;
i>=0;
i--
){


if(history[i]===last)

streak++;


else

break;


}





if(last==="B")

scoreB+=streak*3;


if(last==="P")

scoreP+=streak*3;







// 反转风险


let risk="LOW";


let reverse=0;



if(streak>=5){


risk="HIGH";


reverse=
streak*3;



if(last==="B")

scoreP+=reverse;


else

scoreB+=reverse;



}






// 单跳


let jump=true;


for(
let i=1;
i<history.length;
i++
){


if(
history[i]==history[i-1]
)

jump=false;


}



if(jump){


scoreB-=5;

scoreP-=5;


}






let sum=
scoreB+scoreP;



let bp=
(scoreB/sum*100)
.toFixed(1);



let pp=
(scoreP/sum*100)
.toFixed(1);



bbar.style.width=
bp+"%";


pbar.style.width=
pp+"%";







let result;



if(scoreB>scoreP){


result=
"🔴 BANKER 庄";


prediction.style.color=
"#ef4444";


}

else{


result=
"🔵 PLAYER 闲";


prediction.style.color=
"#3b82f6";


}





prediction.innerHTML=
result;



confidence.innerHTML=

`

AI评分:

${Math.max(bp,pp)}%

<br>

连续:

${streak}局


<br>

风险:

${risk}

`;







report.innerHTML=

`

<b>
AI ANALYSIS REPORT
</b>


<br><br>


样本:

${history.length}局


<br>


庄:

${B}


&nbsp;

闲:

${P}


&nbsp;

和:

${T}



<br><br>


最近走势:

${recent.join(" ")}



<br><br>


当前走势:

${streak}连



<br><br>


单跳:

${jump?"是":"否"}



<br><br>


反转压力:

${reverse}



<br><br>


建议:

${result}



`;



}








// ===============================
// 趋势图
// ===============================


function drawChart(){



let ctx=
document
.getElementById(
"chart"
);



if(!ctx)

return;



let b=0;

let p=0;


let bd=[];

let pd=[];



history.forEach(x=>{


if(x==="B")

b++;


if(x==="P")

p++;



bd.push(b);

pd.push(p);



});




if(chart)

chart.destroy();




chart=
new Chart(
ctx,
{


type:"line",


data:{


labels:
history.map(
(x,i)=>i+1
),


datasets:[


{

label:"庄累计",

data:bd,

borderWidth:3

},


{

label:"闲累计",

data:pd,

borderWidth:3

}


]


},


options:{


responsive:true

}


}

);



}






// 初始化


load();


update();



</script>


</body>


</html>
