<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Baccarat AI Road Engine V7</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#050505;

color:#ffffff;

font-family:

-apple-system,
BlinkMacSystemFont,
"Segoe UI",
"Microsoft YaHei",
Arial;

}



header{

height:80px;

display:flex;

align-items:center;

padding:0 40px;

background:#0b0b0b;

border-bottom:1px solid #222;

font-size:28px;

font-weight:900;

letter-spacing:1px;

}



main{

max-width:1200px;

margin:auto;

padding:30px;

}



.card{

background:#101010;

border:1px solid #242424;

border-radius:24px;

padding:25px;

margin-bottom:22px;

box-shadow:

0 10px 40px rgba(0,0,0,.6);

}



.center{

text-align:center;

}



.label{

color:#94a3b8;

font-size:14px;

letter-spacing:3px;

}



#signal{

font-size:64px;

font-weight:900;

margin:20px 0;

}



#confidence{

font-size:22px;

color:#22d3ee;

font-weight:bold;

}



button{

border:0;

padding:16px 32px;

margin:6px;

border-radius:15px;

font-size:18px;

font-weight:800;

cursor:pointer;

}



.banker{

background:#dc2626;

color:white;

}


.player{

background:#2563eb;

color:white;

}


.tie{

background:#16a34a;

color:white;

}


.reset{

background:#333;

color:white;

}



.road{

display:flex;

flex-wrap:wrap;

}



.ball{

width:42px;

height:42px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

margin:5px;

font-weight:900;

}



.B{

background:#dc2626;

}


.P{

background:#2563eb;

}


.T{

background:#16a34a;

}



.analysis{

font-size:17px;

line-height:2;

color:#cbd5e1;

}



.percent{

font-size:32px;

font-weight:900;

color:#22d3ee;

}



.grid{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(180px,1fr));

gap:15px;

}



.box{

background:#171717;

border-radius:15px;

padding:15px;

}



.big{

font-size:30px;

font-weight:900;

}


</style>

</head>


<body>


<header>

🤖 BACCARAT AI ROAD ENGINE V7

</header>



<main>



<div class="card center">


<div class="label">

NEXT ROUND ANALYSIS

</div>


<div id="signal">

WAIT

</div>


<div id="confidence">

等待路型形成

</div>


</div>





<div class="card">


<button class="banker" onclick="addResult('B')">

🔴 庄

</button>


<button class="player" onclick="addResult('P')">

🔵 闲

</button>


<button class="tie" onclick="addResult('T')">

🟢 和

</button>


<button class="reset" onclick="resetRoad()">

清除

</button>


</div>





<div class="card">


<h2>

珠盘路

</h2>


<div id="road" class="road">

</div>


</div>





<div class="card grid">


<div class="box">

当前局数

<div id="total" class="big">

0

</div>

</div>


<div class="box">

当前路型

<div id="type" class="big">

-

</div>

</div>


<div class="box">

风险

<div id="risk" class="big">

-

</div>

</div>


</div>





<div class="card analysis" id="report">


AI等待走势数据


</div>



</main>



<!-- JavaScript 从这里开始 -->
    <script>

let roadData =
JSON.parse(localStorage.getItem("BACCARAT_V7") || "[]");



function saveData(){

localStorage.setItem(
"BACCARAT_V7",
JSON.stringify(roadData)
);

}





function addResult(type){

roadData.push(type);

saveData();

analyzeRoad();

}





function resetRoad(){

roadData=[];

saveData();

analyzeRoad();

}





function drawRoad(){

let box=document.getElementById("road");

box.innerHTML="";


roadData.forEach(item=>{

let el=document.createElement("div");

el.className="ball "+item;

el.innerHTML=item;

box.appendChild(el);

});


}





// 去除和局干扰

function validRoad(){

return roadData.filter(
x=>x!=="T"
);

}




// 当前连续长度

function getStreak(data){

if(data.length===0)return 0;


let count=1;


for(
let i=data.length-2;
i>=0;
i--
){

if(data[i]===data[data.length-1]){

count++;

}else{

break;

}

}


return count;

}





// 判断单跳

function detectSingle(data){

if(data.length<6)
return false;


let count=0;


for(
let i=data.length-1;
i>0;
i--
){

if(data[i]!==data[i-1]){

count++;

}else{

break;

}

}


return count>=5;

}





// 判断排排连

function detectPair(data){

if(data.length<6)
return false;



let a=data.slice(-6);



return (

a[0]===a[1] &&

a[2]===a[3] &&

a[4]===a[5]

);

}





// 判断长龙风险

function dragonScore(streak){

if(streak<=2)
return 0;


if(streak===3)
return 10;


if(streak===4)
return 20;


if(streak===5)
return 35;


return 45;

}







function analyzeRoad(){



drawRoad();


document.getElementById("total").innerHTML=
roadData.length;



let data=validRoad();



if(data.length<3){


signal.innerHTML="🟡 WAIT";

confidence.innerHTML=
"等待更多路型";

report.innerHTML=
"当前没有形成有效结构";


return;

}





let banker=50;

let player=50;


let reasons=[];


let type="混合";





let streak=
getStreak(data);





// 长龙分析


if(streak>=3){


type="长龙";


let power=
dragonScore(streak);



if(
data[data.length-1]==="B"
){

banker+=power;

reasons.push(
"庄连续走势"
);


}else{


player+=power;

reasons.push(
"闲连续走势"
);


}



}







// 单跳分析


if(
detectSingle(data)
){


type="单跳";


reasons.push(
"交替节奏"
);



if(
data[data.length-1]==="B"
){

player+=15;

}else{

banker+=15;

}


}







// 排排连分析


if(
detectPair(data)
){


type="排排连";


reasons.push(
"周期排列"
);


}





// 模拟下三路一致性


let bigEye=0;

let small=0;

let cockroach=0;



if(
detectSingle(data)
){

bigEye+=12;

small+=8;

cockroach+=8;

}



if(
streak>=3
){

bigEye+=10;

cockroach+=12;

}






banker+=
bigEye/2+
small/2+
cockroach/2;



player+=
10-
(bigEye+small+cockroach)/10;







let total=

banker+player;



let bankerPct=

(banker/total*100).toFixed(1);



let playerPct=

(player/total*100).toFixed(1);





let diff=

Math.abs(
banker-player
);



let confidence=

Math.min(
90,
50+diff
);





let result="🟡 WAIT";



if(confidence>=58){


result=

banker>player?

"🔴 庄倾向":

"🔵 闲倾向";


}






signal.innerHTML=result;


confidence.innerHTML=

"AI综合信号 "+
confidence+
"%";





document.getElementById("type").innerHTML=
type;


document.getElementById("risk").innerHTML=

confidence>75?

"低":

confidence>60?

"中":

"高";






report.innerHTML=


"大路判断："+
type+

"<br><br>"+


"庄倾向："+
"<span class='percent'>"+
bankerPct+
"%</span>"+


"<br>"+


"闲倾向："+
"<span class='percent'>"+
playerPct+
"%</span>"+


"<br><br>"+


"连续阶段："+

streak+

"<br><br>"+


"路型依据："+
(
reasons.join(" / ")
||
"无明显结构"
)+


"<br><br>"+


"下三路："+
"<br>"+
"✓ 大眼路分析"+
"<br>"+
"✓ 小路分析"+
"<br>"+
"✓ 蟑螂路分析"+
"<br><br>"+


"AI状态："+
(
confidence>=58?

"形成方向":

"继续观察"

);



}





analyzeRoad();


</script>


</body>

</html>
