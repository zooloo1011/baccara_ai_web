<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
Baccarat AI Analyzer Pro
</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#050816;

color:#fff;

font-family:
"Microsoft YaHei",
Arial;

}



header{

height:80px;

background:
linear-gradient(
90deg,
#111827,
#020617
);

display:flex;

align-items:center;

padding:0 30px;

font-size:28px;

font-weight:bold;

color:#00eaff;

border-bottom:
1px solid #334155;

}



.status{

margin-left:auto;

font-size:15px;

color:#22c55e;

}



.container{

padding:25px;

max-width:1400px;

margin:auto;

}




.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}



.card{

background:#111827;

padding:20px;

border-radius:15px;

box-shadow:
0 0 20px #000;

}




.title{

color:#94a3b8;

font-size:14px;

}


.value{

font-size:32px;

margin-top:10px;

color:#00eaff;

}




button{

padding:12px 20px;

margin:5px;

border:0;

border-radius:8px;

cursor:pointer;

font-size:16px;

font-weight:bold;

}



.btn-b{

background:#dc2626;

color:white;

}



.btn-p{

background:#2563eb;

color:white;

}



.btn-t{

background:#16a34a;

color:white;

}



.btn-main{

background:#00eaff;

color:#020617;

}



.btn-gray{

background:#475569;

color:white;

}




.section{

margin-top:25px;

display:grid;

grid-template-columns:

2fr 1fr;

gap:20px;

}





.ball{

width:38px;

height:38px;

display:inline-flex;

align-items:center;

justify-content:center;

border-radius:50%;

margin:4px;

font-weight:bold;

}


.B{

background:#dc2626;

}



.P{

background:#2563eb;

}



.T{

background:#16a34a;

}





.road-box{

background:#020617;

padding:15px;

border-radius:10px;

min-height:100px;

}





.table-road{

display:grid;

grid-template-columns:
repeat(12,40px);

gap:5px;

}



.cell{

width:35px;

height:35px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-weight:bold;

}




.analysis{

background:#020617;

padding:20px;

border-radius:12px;

line-height:1.8;

color:#00eaff;

}




.progress{

height:20px;

background:#334155;

border-radius:20px;

overflow:hidden;

margin:8px 0;

}



.progress div{

height:100%;

background:#00eaff;

width:0%;

}





canvas{

background:#020617;

border-radius:10px;

padding:10px;

}





input[type=file]{

display:none;

}



.file-btn{

background:#f59e0b;

padding:12px;

border-radius:8px;

cursor:pointer;

display:inline-block;

color:#000;

font-weight:bold;

}




</style>

</head>



<body>



<header>


🤖 Baccarat AI Analyzer Pro


<div class="status">

● AI ENGINE ONLINE

</div>


</header>





<div class="container">



<!-- 数据统计 -->

<div class="grid">


<div class="card">

<div class="title">
历史数据量
</div>

<div class="value"
id="totalCount">
0
</div>

</div>




<div class="card">

<div class="title">
庄数量
</div>

<div class="value"
id="bankerCount">
0
</div>

</div>




<div class="card">

<div class="title">
闲数量
</div>

<div class="value"
id="playerCount">
0
</div>

</div>




<div class="card">

<div class="title">
和数量
</div>

<div class="value"
id="tieCount">
0
</div>

</div>


</div>






<!-- 输入区域 -->


<div class="card"
style="margin-top:20px">


<h2>
输入百家乐结果
</h2>



<button class="btn-b"
onclick="addResult('B')">

庄 Banker

</button>


<button class="btn-p"
onclick="addResult('P')">

闲 Player

</button>



<button class="btn-t"
onclick="addResult('T')">

和 Tie

</button>



<button class="btn-gray"
onclick="clearAll()">

清空

</button>




<label class="file-btn">

导入CSV

<input type="file"
id="csvFile"
accept=".csv">

</label>



<button class="btn-main"
onclick="exportCSV()">

导出CSV

</button>


</div>






<!-- 最近路单 -->

<div class="section">


<div class="card">


<h2>
历史路单
</h2>


<div class="road-box"
id="historyRoad">

</div>


</div>




<div class="card">


<h2>
AI趋势评分

</h2>


<p>
庄概率
</p>

<div class="progress">
<div id="bankerBar"></div>
</div>



<p>
闲概率
</p>


<div class="progress">
<div id="playerBar"></div>
</div>



<p>
和比例
</p>


<div class="progress">
<div id="tieBar"></div>
</div>



</div>


</div>







<!-- 五大路纸 -->


<div class="section">


<div class="card">


<h2>
大路 Big Road
</h2>


<div class="table-road"
id="bigRoad">

</div>


</div>





<div class="card">


<h2>
珠盘路 Bead Plate
</h2>


<div class="table-road"
id="beadRoad">

</div>


</div>



</div>






<div class="section">


<div class="card">


<h2>
大眼路 Big Eye Boy

</h2>


<div class="table-road"
id="eyeRoad">

</div>


</div>




<div class="card">


<h2>
小路 Small Road

</h2>


<div class="table-road"
id="smallRoad">

</div>


</div>



</div>






<div class="card"
style="margin-top:25px">


<h2>
AI分析报告
</h2>


<div class="analysis"
id="report">

等待输入数据...

</div>


</div>







<div class="card"
style="margin-top:25px">


<h2>
趋势图表

</h2>


<canvas id="trendChart"></canvas>


</div>



</div>




<script>
    
// ==========================
// 全局数据
// ==========================

let history = [];

let chart;



// ==========================
// 输入结果
// ==========================


function addResult(type){

history.push(type);

saveData();

updateAll();

}



// 清空

function clearAll(){

history=[];

localStorage.removeItem(
"baccarat_history"
);

updateAll();

}



// ==========================
// 更新全部界面
// ==========================


function updateAll(){

updateCount();

renderHistory();

generateRoads();

runAI();

drawChart();

}



// ==========================
// 数据统计
// ==========================


function updateCount(){


let B =
history.filter(
x=>x==="B"
).length;


let P =
history.filter(
x=>x==="P"
).length;


let T =
history.filter(
x=>x==="T"
).length;



document.getElementById(
"totalCount"
).innerHTML =
history.length;


document.getElementById(
"bankerCount"
).innerHTML =
B;


document.getElementById(
"playerCount"
).innerHTML =
P;


document.getElementById(
"tieCount"
).innerHTML =
T;


}




// ==========================
// 历史球显示
// ==========================


function renderHistory(){


let box =
document.getElementById(
"historyRoad"
);


box.innerHTML="";


history.forEach(
x=>{


let d =
document.createElement(
"span"
);


d.className=
"ball "+x;


d.innerHTML=x;


box.appendChild(d);


}

);


}






// ==========================
// 珠盘路
// ==========================


function beadRoad(){


let result=[];


history.forEach(
x=>{


result.push(x);


}
);


return result;


}





// ==========================
// 大路算法
// ==========================


function bigRoad(){


let columns=[];


let column=[];


let last=null;



history.forEach(
x=>{


if(x==="T")
return;



if(
last===null ||
x===last
){


column.push(x);


}

else{


columns.push(column);


column=[x];


}


last=x;


});


if(column.length)
columns.push(column);



return columns;


}




// ==========================
// 大眼路模拟
// ==========================


function eyeRoad(){


let road=bigRoad();


let result=[];



for(
let i=1;
i<road.length;
i++
){


if(
road[i].length===
road[i-1].length
)

result.push("P");


else

result.push("B");


}


return result;


}





// ==========================
// 小路模拟
// ==========================


function smallRoad(){


let road=bigRoad();


let result=[];



for(
let i=2;
i<road.length;
i++
){


if(
road[i].length>
road[i-1].length
)

result.push("B");


else

result.push("P");


}



return result;


}




// ==========================
// 曱甴路模拟
// ==========================


function cockroachRoad(){


let road=bigRoad();


let result=[];


for(
let i=3;
i<road.length;
i++
){


if(
road[i].length%2===0
)

result.push("B");


else

result.push("P");


}


return result;


}







// ==========================
// 显示路纸
// ==========================


function drawRoad(
id,
data
){


let box =
document.getElementById(id);


box.innerHTML="";



data.flat ?
data=data.flat():
data=data;



data.forEach(
x=>{


let d =
document.createElement(
"div"
);


d.className=
"cell "+x;


d.innerHTML=x;



box.appendChild(d);


});


}




function generateRoads(){



drawRoad(
"beadRoad",
beadRoad()
);



drawRoad(
"bigRoad",
bigRoad()
);



drawRoad(
"eyeRoad",
eyeRoad()
);



drawRoad(
"smallRoad",
smallRoad()
);



}






// ==========================
// AI核心分析
// ==========================


function runAI(){


if(history.length<5){

return;

}



let total =
history.length;



let B =
history.filter(
x=>x==="B"
).length;



let P =
history.filter(
x=>x==="P"
).length;



let T =
history.filter(
x=>x==="T"
).length;





let bankerScore=50;

let playerScore=50;





// ---- 历史权重 ----


if(B>P)

bankerScore+=10;

else

playerScore+=10;





// ---- 最近趋势 ----


let recent =
history.slice(-20);



let recentB =
recent.filter(
x=>x==="B"
).length;


let recentP =
recent.filter(
x=>x==="P"
).length;



if(recentB>recentP)

bankerScore+=15;


else

playerScore+=15;






// ---- 连续走势 ----


let last =
history[
history.length-1
];



let streak=1;



for(
let i=history.length-2;
i>=0;
i--
){


if(history[i]===last)

streak++;


else

break;


}



if(last==="B")

bankerScore+=streak*2;



if(last==="P")

playerScore+=streak*2;







// ---- 交替检测 ----


let alternate=true;



for(
let i=1;
i<history.length;
i++
){


if(
history[i]===
history[i-1]
)

alternate=false;


}




if(alternate){

bankerScore-=5;

playerScore-=5;

}





// ---- 热冷 ----


let hot;


if(B>P)

hot="庄较热";

else

hot="闲较热";





// 最终比例


let sum =
bankerScore+
playerScore;



let bRate =
(bankerScore/sum*100)
.toFixed(1);



let pRate =
(playerScore/sum*100)
.toFixed(1);



let prediction;


if(
bankerScore>
playerScore
)

prediction="庄 Banker";

else

prediction="闲 Player";






document.getElementById(
"bankerBar"
)
.style.width=
bRate+"%";



document.getElementById(
"playerBar"
)
.style.width=
pRate+"%";



document.getElementById(
"tieBar"
)
.style.width=
(T/total*100)+"%";






document.getElementById(
"report"
)
.innerHTML=

`

<b>
AI分析完成
</b>

<br><br>


样本:
${total}局


<br>


庄:
${B}

&nbsp;

闲:
${P}

&nbsp;

和:
${T}


<br><br>


最近20局:

${recent.join(" ")}


<br><br>


当前:

${last}

连续:
${streak}


<br><br>


冷热:

${hot}


<br><br>


交替:

${alternate?
"发现交替":
"无明显交替"}


<br><br>


AI评分:

<br>


庄:
${bRate}%


<br>


闲:
${pRate}%


<br><br>


趋势参考:

<b>
${prediction}
</b>


`;



    }
    
// ==========================
// 本地保存
// ==========================


function saveData(){

localStorage.setItem(
"baccarat_history",
JSON.stringify(history)
);

}




// ==========================
// 加载历史数据
// ==========================


function loadData(){

let data =
localStorage.getItem(
"baccarat_history"
);


if(data){

history =
JSON.parse(data);

}


}





// ==========================
// CSV导入
// 格式:
// B,P,B,T,P
// 或
// 庄,闲,和
// ==========================


document
.getElementById(
"csvFile"
)
.addEventListener(
"change",
function(e){


let file =
e.target.files[0];


if(!file)
return;



let reader =
new FileReader();



reader.onload=function(){

let text =
reader.result;



let arr =
text
.replace(/\r/g,"")
.split(/,|\n/)
.map(
x=>x.trim()
);



history=[];



arr.forEach(
x=>{


if(
x==="B"||
x==="P"||
x==="T"
){

history.push(x);

}



if(x==="庄")

history.push("B");



if(x==="闲")

history.push("P");



if(x==="和")

history.push("T");



});



saveData();

updateAll();


};



reader.readAsText(file);



});








// ==========================
// CSV导出
// ==========================


function exportCSV(){


if(history.length===0){

alert(
"没有数据"
);

return;

}



let csv =
history.join(",");



let blob =
new Blob(
[csv],
{
type:"text/csv"
}
);



let url =
URL.createObjectURL(blob);



let a =
document.createElement(
"a"
);



a.href=url;


a.download=
"baccarat_history.csv";



a.click();



URL.revokeObjectURL(url);



}







// ==========================
// 趋势图
// ==========================


function drawChart(){



let ctx =
document
.getElementById(
"trendChart"
);



if(!ctx)
return;




let B=[];

let P=[];



let b=0;

let p=0;



history.forEach(
(x,i)=>{


if(x==="B")
b++;


if(x==="P")
p++;


B.push(b);

P.push(p);



});





if(chart){

chart.destroy();

}





chart =
new Chart(
ctx,
{


type:"line",


data:{


labels:
history.map(
(x,i)=>i+1
),



datasets:[


{


label:
"Banker累计",

data:B,

borderWidth:2


},



{


label:
"Player累计",

data:P,

borderWidth:2


}



]


},



options:{


responsive:true,


plugins:{


legend:{


labels:{


color:"white"


}


}


},



scales:{


x:{


ticks:{


color:"white"


}

},


y:{


ticks:{


color:"white"


}

}


}


}



}

);


}






// ==========================
// 初始化
// ==========================


loadData();


updateAll();



</script>


</body>


</html>
