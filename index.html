<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Baccarat AI Ultimate Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#020617;

color:white;

font-family:
"Microsoft YaHei",
Arial;

}



header{

height:90px;

background:
linear-gradient(90deg,#111827,#020617);

display:flex;

align-items:center;

padding:0 30px;

font-size:30px;

font-weight:bold;

color:#00eaff;

}



.online{

margin-left:auto;

font-size:15px;

color:#22c55e;

}




.container{

padding:25px;

max-width:1400px;

margin:auto;

}





.panel{

background:#111827;

border-radius:18px;

padding:25px;

margin-bottom:25px;

box-shadow:
0 0 25px #000;

}





.ai-box{

text-align:center;

border:
1px solid #00eaff;

background:
linear-gradient(
135deg,
#020617,
#111827
);

}





#prediction{

font-size:60px;

font-weight:bold;

margin:20px;

color:#00eaff;

}




#confidence{

font-size:22px;

color:#94a3b8;

}




.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:20px;

}




.card{

background:#0f172a;

padding:20px;

border-radius:12px;

}



.card-title{

color:#94a3b8;

}


.number{

font-size:35px;

color:#00eaff;

margin-top:10px;

}





button{

padding:14px 22px;

margin:5px;

border:0;

border-radius:10px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}



.banker{

background:#dc2626;

color:white;

}



.player{

background:#2563eb;

color:white;

}



.tie{

background:#16a34a;

color:white;

}



.main{

background:#00eaff;

color:#020617;

}




input{

width:80%;

padding:15px;

background:#020617;

border:1px solid #334155;

border-radius:10px;

color:white;

font-size:18px;

}





.ball{

width:42px;

height:42px;

display:inline-flex;

justify-content:center;

align-items:center;

border-radius:50%;

margin:5px;

font-weight:bold;

}



.B{

background:#dc2626;

}



.P{

background:#2563eb;

}



.T{

background:#16a34a;

}





.road{

background:#020617;

padding:15px;

border-radius:12px;

min-height:80px;

}




.progress{

height:22px;

background:#334155;

border-radius:20px;

overflow:hidden;

}



.bar{

height:100%;

background:#00eaff;

width:0%;

}




.report{

background:#020617;

padding:20px;

border-radius:12px;

line-height:1.8;

color:#00eaff;

}





</style>


</head>



<body>


<header>

🤖 Baccarat AI Ultimate Pro


<div class="online">

● AI ENGINE ONLINE

</div>


</header>





<div class="container">



<!-- AI预测 -->

<div class="panel ai-box">


<h2>

NEXT ROUND AI SIGNAL

</h2>



<div id="prediction">

等待数据

</div>



<div id="confidence">

输入历史记录开始分析

</div>



</div>








<!-- 输入 -->

<div class="panel">


<h2>

历史数据输入

</h2>


<input id="historyInput"

placeholder="例如 BPPBBTBBP">


<br><br>



<button class="main"
onclick="loadInput()">

分析数据

</button>


<button class="banker"
onclick="add('B')">

庄 BANKER

</button>


<button class="player"
onclick="add('P')">

闲 PLAYER

</button>


<button class="tie"
onclick="add('T')">

和 TIE

</button>



<button onclick="clearData()">

清空

</button>


</div>






<!-- 数据 -->

<div class="grid">


<div class="card">

<div class="card-title">

总局数

</div>

<div class="number"
id="total">

0

</div>

</div>




<div class="card">

<div class="card-title">

庄

</div>

<div class="number"
id="banker">

0

</div>

</div>




<div class="card">

<div class="card-title">

闲

</div>

<div class="number"
id="player">

0

</div>

</div>




<div class="card">

<div class="card-title">

和

</div>

<div class="number"
id="tie">

0

</div>

</div>


</div>






<div class="panel">


<h2>

历史路单

</h2>


<div class="road"
id="road">

</div>


</div>





<div class="panel">


<h2>

AI趋势评分

</h2>


<p>

庄趋势

</p>


<div class="progress">

<div class="bar"
id="bankerBar">

</div>

</div>




<p>

闲趋势

</p>


<div class="progress">

<div class="bar"
id="playerBar">

</div>

</div>



</div>




<div class="panel">


<h2>

AI分析报告

</h2>


<div class="report"
id="report">

等待分析

</div>


</div>




<div class="panel">


<h2>

走势曲线

</h2>


<canvas id="chart">

</canvas>


</div>



<script>
    // ===============================
// Baccarat AI Engine
// ===============================


let history=[];

let chart;



// 添加结果

function add(x){

history.push(x);

save();

update();

}




// 批量输入

function loadInput(){


let text=
document
.getElementById(
"historyInput"
)
.value
.toUpperCase();


history=[];


for(let x of text){


if(
x==="B"||
x==="P"||
x==="T"
){

history.push(x);

}


}


save();

update();


}




// 清空


function clearData(){

history=[];

localStorage.removeItem(
"bac_ai"
);

update();

}



// 保存


function save(){

localStorage.setItem(
"bac_ai",
JSON.stringify(history)
);

}



// 读取


function load(){


let d=
localStorage.getItem(
"bac_ai"
);


if(d){

history=
JSON.parse(d);

}


}





// ===============================
// 数据统计
// ===============================


function update(){


let B=
history.filter(
x=>x==="B"
).length;


let P=
history.filter(
x=>x==="P"
).length;


let T=
history.filter(
x=>x==="T"
).length;



total.innerHTML=
history.length;


banker.innerHTML=B;


player.innerHTML=P;


tie.innerHTML=T;



drawRoad();


AI();



drawChart();



}






// ===============================
// 路单显示
// ===============================


function drawRoad(){


let box=
document.getElementById(
"road"
);


box.innerHTML="";



history.forEach(x=>{


let e=
document.createElement(
"span"
);


e.className=
"ball "+x;


e.innerHTML=x;


box.appendChild(e);



});


}






// ===============================
// AI分析模型
// ===============================


function AI(){


if(history.length<5)

return;



let total=
history.length;



let B=
history.filter(
x=>x==="B"
).length;


let P=
history.filter(
x=>x==="P"
).length;



let T=
history.filter(
x=>x==="T"
).length;






let bankerScore=50;


let playerScore=50;





// ----------------
// 历史比例
// ----------------


if(B>P)

bankerScore+=10;

else

playerScore+=10;






// ----------------
// 最近趋势
// ----------------


let recent=
history.slice(-20);



let rb=
recent.filter(
x=>"B"===x
).length;



let rp=
recent.filter(
x=>"P"===x
).length;



if(rb>rp)

bankerScore+=15;

else

playerScore+=15;








// ----------------
// 连续走势
// ----------------


let last=
history[
history.length-1
];



let streak=1;


for(
let i=history.length-2;
i>=0;
i--
){


if(history[i]===last)

streak++;

else

break;


}





if(last==="B")

bankerScore+=
streak*3;



if(last==="P")

playerScore+=
streak*3;






// ----------------
// 反转压力
// ----------------


let reverse=0;



if(streak>=5){


reverse=
streak*3;



if(last==="B")

playerScore+=reverse;


else

bankerScore+=reverse;



}





// ----------------
// 单跳检测
// ----------------


let single=true;



for(
let i=1;
i<history.length;
i++
){


if(
history[i]===
history[i-1]
)

single=false;



}



if(single){

bankerScore-=5;

playerScore-=5;

}





// ----------------
// 平衡修正
// ----------------


if(
Math.abs(B-P)<5
){


bankerScore+=5;

playerScore+=5;


}





// 最终评分


let sum=
bankerScore+
playerScore;



let bp=
(bankerScore/sum*100)
.toFixed(1);



let pp=
(playerScore/sum*100)
.toFixed(1);





bankerBar.style.width=
bp+"%";



playerBar.style.width=
pp+"%";






let result;



if(bankerScore>playerScore){


result=
"🔴 BANKER 庄";


prediction.style.color=
"#ef4444";


}

else{


result=
"🔵 PLAYER 闲";


prediction.style.color=
"#3b82f6";


}





prediction.innerHTML=
result;



confidence.innerHTML=

`

AI置信度:
${Math.max(bp,pp)}%


<br>

当前:
${last}

连续:
${streak}局


`;







report.innerHTML=

`

<b>
AI DATA REPORT
</b>


<br><br>


样本:
${total}局


<br>


庄:
${B}


&nbsp;


闲:
${P}


&nbsp;


和:
${T}



<br><br>


最近20局:

${recent.join(" ")}



<br><br>


走势:

${
streak>=4?
"长龙状态":
"正常"
}



<br><br>


单跳:

${
single?
"发现单跳":
"无"
}



<br><br>


反转压力:

${reverse}



<br><br>


预测:

<b>

${result}

</b>


`;



}
    
// ===============================
// 趋势图
// ===============================


function drawChart(){


let ctx=
document
.getElementById(
"chart"
);



if(!ctx)
return;



let b=0;

let p=0;


let bd=[];

let pd=[];



history.forEach(x=>{


if(x==="B")

b++;



if(x==="P")

p++;



bd.push(b);

pd.push(p);



});





if(chart){

chart.destroy();

}





chart=
new Chart(
ctx,
{


type:"line",


data:{


labels:
history.map(
(x,i)=>i+1
),


datasets:[


{


label:"庄累计",

data:bd,

borderWidth:3


},


{


label:"闲累计",

data:pd,

borderWidth:3


}



]


},




options:{


responsive:true,


plugins:{


legend:{


labels:{


color:"white"

}

}

},



scales:{


x:{


ticks:{

color:"white"

}

},


y:{


ticks:{

color:"white"

}

}


}



}


}

);


}






// ===============================
// 自动加载
// ===============================


load();


update();



</script>


</body>


</html>
