<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Baccarat AI Road Engine V8</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#030303;

color:#fff;

font-family:
"Microsoft YaHei",
Arial,
sans-serif;

}



header{

height:85px;

display:flex;

align-items:center;

padding-left:35px;

background:#0b0b0b;

border-bottom:1px solid #222;

font-size:30px;

font-weight:900;

}



main{

max-width:1300px;

margin:auto;

padding:25px;

}



.card{

background:#101010;

border:1px solid #242424;

border-radius:22px;

padding:25px;

margin-bottom:20px;

}



.title{

font-size:20px;

font-weight:800;

margin-bottom:15px;

color:#ddd;

}



.center{

text-align:center;

}



#signal{

font-size:60px;

font-weight:900;

margin:20px;

}



#confidence{

font-size:24px;

color:#22d3ee;

}



button{

padding:15px 30px;

border:0;

border-radius:14px;

margin:5px;

font-size:18px;

font-weight:900;

cursor:pointer;

}



.b{

background:#dc2626;

color:#fff;

}



.p{

background:#2563eb;

color:#fff;

}



.t{

background:#16a34a;

color:#fff;

}



.reset{

background:#333;

color:white;

}



.roadBox{

display:flex;

flex-wrap:wrap;

}



.ball{

width:40px;

height:40px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

margin:5px;

font-weight:900;

}



.B{

background:#dc2626;

}


.P{

background:#2563eb;

}


.T{

background:#16a34a;

}



.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;

}



.panel{

background:#181818;

padding:18px;

border-radius:15px;

}



.big{

font-size:28px;

font-weight:900;

}



.blue{

color:#22d3ee;

}



.red{

color:#ef4444;

}



.analysis{

line-height:2;

color:#cbd5e1;

}



</style>

</head>


<body>


<header>

🤖 BACCARAT AI ROAD ENGINE V8

</header>



<main>



<div class="card center">

<div>
NEXT ROUND ANALYSIS
</div>


<div id="signal">

WAIT

</div>


<div id="confidence">

等待走势

</div>


</div>





<div class="card">


<button class="b" onclick="add('B')">

🔴 庄

</button>


<button class="p" onclick="add('P')">

🔵 闲

</button>


<button class="t" onclick="add('T')">

🟢 和

</button>


<button class="reset" onclick="resetAll()">

清除

</button>


</div>





<div class="card">


<div class="title">

珠盘路

</div>


<div id="beadRoad" class="roadBox">

</div>


</div>





<div class="card">


<div class="title">

大路结构

</div>


<div id="bigRoad" class="roadBox">

</div>


</div>





<div class="card grid">


<div class="panel">

大路状态

<div id="roadType" class="big">

-

</div>

</div>



<div class="panel">

大眼路

<div id="eyeRoad" class="big">

-

</div>

</div>




<div class="panel">

小路

<div id="smallRoad" class="big">

-

</div>

</div>




<div class="panel">

蟑螂路

<div id="cockRoad" class="big">

-

</div>

</div>


</div>





<div class="card analysis" id="report">

AI等待分析

</div>



<script>
    let results =
JSON.parse(localStorage.getItem("BACCARAT_V8") || "[]");



function save(){

localStorage.setItem(
"BACCARAT_V8",
JSON.stringify(results)
);

}




function add(x){

results.push(x);

save();

analyze();

}





function resetAll(){

results=[];

save();

analyze();

}





// 珠盘路

function drawBead(){

let box=document.getElementById("beadRoad");

box.innerHTML="";


results.forEach(x=>{

let d=document.createElement("div");

d.className="ball "+x;

d.innerHTML=x;

box.appendChild(d);

});

}




// 去掉和

function pure(){

return results.filter(
x=>x!="T"
);

}






// 获取连续

function getStreak(data){

if(data.length===0)
return 0;


let n=1;


for(
let i=data.length-2;
i>=0;
i--
){

if(
data[i]===data[data.length-1]
){

n++;

}else{

break;

}

}


return n;

}







// 生成大路结构

function buildBigRoad(data){


let cols=[];


let current=[];


let last=null;



data.forEach(x=>{


if(x!==last){


if(current.length)
cols.push(current);


current=[x];


last=x;


}else{


current.push(x);


}


});


if(current.length)
cols.push(current);



return cols;

}






function drawBigRoad(cols){


let box=document.getElementById("bigRoad");


box.innerHTML="";



cols.forEach(col=>{


let c=document.createElement("div");


col.forEach(x=>{


let b=document.createElement("div");


b.className="ball "+x;

b.innerHTML=x;


c.appendChild(b);


});


box.appendChild(c);


});

}




// 单跳检测

function singleJump(data){


if(data.length<6)
return false;



for(
let i=data.length-1;
i>data.length-6;
i--
){


if(
data[i]===data[i-1]
){

return false;

}


}


return true;


}






// 排排连检测

function pairRoad(data){


if(data.length<6)
return false;



let a=data.slice(-6);


return (

a[0]==a[1]&&

a[2]==a[3]&&

a[4]==a[5]

);


}







// 双节奏检测

function doubleRoad(data){


if(data.length<8)
return false;


let a=data.slice(-8);



return (

a[0]==a[1]&&

a[2]==a[3]&&

a[4]==a[5]&&

a[6]==a[7]

);



}








// 主路型分析


function roadAnalysis(data){



let type="混合";

let reason=[];



let streak=getStreak(data);



if(streak>=3){

type="长龙趋势";

reason.push(
"连续走势形成"
);

}




if(singleJump(data)){

type="单跳结构";

reason.push(
"交替节奏稳定"
);

}




if(pairRoad(data)){

type="排排连结构";

reason.push(
"两连周期"
);

}




if(doubleRoad(data)){

type="双跳结构";

reason.push(
"周期重复"
);

}



return {

type,

streak,

reason

};


}
    


// =============================
// 下三路模拟分析
// =============================



function downRoadAnalysis(data,road){


let eye=0;

let small=0;

let cock=0;



let type="中性";



// 大眼路逻辑
// 观察大路变化节奏

if(road.type==="长龙趋势"){

eye+=15;

cock+=12;

}


if(road.type==="单跳结构"){

eye+=12;

small+=15;

}



if(road.type==="排排连结构"){

small+=12;

cock+=10;

}




if(data.length>10){

eye+=5;

cock+=5;

}



let max=Math.max(
eye,
small,
cock
);



if(max===eye)
type="支持趋势";

else if(max===small)
type="节奏明显";

else if(max===cock)
type="方向偏移";


return{

eye,
small,
cock,
type

};


}







// =============================
// AI综合评分
// =============================



function calculateAI(data,road,down){


let banker=50;

let player=50;


let reason=[];



// 大路权重


if(road.type==="长龙趋势"){


if(
data[data.length-1]==="B"
){

banker+=18;

reason.push("庄趋势延续");

}
else{

player+=18;

reason.push("闲趋势延续");

}


}



if(road.type==="单跳结构"){


if(
data[data.length-1]==="B"
){

player+=12;

}
else{

banker+=12;

}


reason.push("交替节奏");

}



if(road.type==="排排连结构"){

reason.push("周期节奏");


}






// 下三路辅助


banker +=

(down.eye+
down.small+
down.cock)/4;



player +=

(down.eye+
down.small+
down.cock)/5;



// 风险修正


let diff=Math.abs(
banker-player
);



let confidence=
Math.min(
90,
50+diff
);



// 没有一致性降低

if(diff<8){

confidence=45;

}



return{

banker:
(banker/(banker+player)*100).toFixed(1),

player:
(player/(banker+player)*100).toFixed(1),

confidence,

reason

};


}








// =============================
// 主程序
// =============================



function analyze(){



drawBead();



let data=pure();



if(data.length<3){


signal.innerHTML="🟡 WAIT";

confidence.innerHTML=
"等待走势";


return;


}



let big=buildBigRoad(data);


drawBigRoad(big);



let road=roadAnalysis(data);



let down=
downRoadAnalysis(
data,
road
);



let ai=
calculateAI(
data,
road,
down
);






roadType.innerHTML=
road.type;


eyeRoad.innerHTML=
down.type;


smallRoad.innerHTML=
down.small>10?
"支持":
"观察";



cockRoad.innerHTML=
down.cock>10?
"支持":
"观察";






let output="🟡 WAIT";



if(
ai.confidence>=58
){


output=
ai.banker>ai.player?

"🔴 庄倾向":

"🔵 闲倾向";


}



signal.innerHTML=
output;



confidence.innerHTML=
"AI信号 "+
ai.confidence+
"%";







report.innerHTML=


"当前路型："+
road.type+

"<br><br>"+


"庄倾向："+
"<span class='percent'>"+
ai.banker+
"%</span>"+

"<br>"+


"闲倾向："+
"<span class='percent'>"+
ai.player+
"%</span>"+


"<br><br>"+


"长龙阶段："+
road.streak+

"<br><br>"+


"下三路："+
"<br>"+
"大眼路："+down.eye+
"<br>"+
"小路："+down.small+
"<br>"+
"蟑螂路："+down.cock+

"<br><br>"+


"分析依据："+
(
ai.reason.join(" / ")
||
"结构不足"
)+


"<br><br>"+

"AI状态："+
(
ai.confidence>=58?
"形成观察信号":
"等待确认"
);



}




analyze();



</script>


</body>

</html>
